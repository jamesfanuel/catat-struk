name: catatstruk_mobile
description: Aplikasi mobile CatatStruk untuk Android dan iOS — foto struk belanja, ekstrak otomatis dengan AI, dan catat ke aplikasi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
